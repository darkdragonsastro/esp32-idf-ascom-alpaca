[platformio]
default_envs = esp32-idf-ascom-alpaca

[env:esp32-idf-ascom-alpaca]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = espidf
build_type = release

; Alpaca protocol tests: the real api.cpp handlers against host stand-ins for
; the ESP-IDF headers (test/alpaca_stubs) and fake devices. cJSON is the copy
; ESP-IDF ships (test/native_lib/cJSON), so the tests run the same JSON code.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<alpaca_server/api.cpp> +<alpaca_server/device.cpp>
; The two -Wno flags hide host-only warnings from src/: macOS marks sprintf
; deprecated, and size_t is 64-bit here, so its "%d" arguments warn.
build_flags = -std=gnu++17 -Itest/alpaca_stubs -Wno-deprecated-declarations -Wno-format
lib_extra_dirs = test/native_lib
